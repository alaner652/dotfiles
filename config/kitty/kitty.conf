 -# ============================================================
# --- 1. 顏色與字體 (Colors & Fonts) ---
# ============================================================
# 引入你的配色檔，確保 color4 (藍) 等變數可用
include colors.conf

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        18.0

# 光標設定
cursor_blink_interval 0
cursor_shape          block
shell_integration     no-cursor

# ============================================================
# --- 2. 視窗美化 (Window UI) ---
# ============================================================
window_padding_width         15
background_opacity           0.95
dynamic_background_opacity   yes
confirm_os_window_close      0
hide_window_decorations      yes
placement_strategy           center

# 邊框強化 (Active 使用你的主題色 #adc6ff)
active_border_color     #adc6ff
inactive_border_color   #262626
window_border_width     1pt
draw_minimal_borders    yes

# ============================================================
# --- 3. 終極分頁列 (採用 Python 自定義渲染) ---
# ============================================================
# 這裡設為 custom，Kitty 會去讀取同目錄下的 tab_bar.py
tab_bar_style           custom

tab_bar_edge            bottom
tab_bar_align           left
tab_bar_min_tabs        2
tab_bar_margin_width    15
tab_bar_margin_height   10 10
tab_bar_background      none

# ============================================================
# --- 4. 系統優化與滑鼠 ---
# ============================================================
scrollback_lines        10000
copy_on_select          clipboard
strip_trailing_spaces   smart
mouse_hide_wait         3.0
url_style               curly
focus_follows_mouse     yes

# macOS 專屬 (Arch 會自動忽略)
macos_option_as_alt           both
macos_quit_when_last_window_closed yes
macos_show_window_title_in    none

# ============================================================
# --- 5. 快捷鍵設定 (Alt 組合) ---
# ============================================================
enabled_layouts splits,stack,tall,fat

# --- 視窗管理 ---
map alt+v        launch --location=vsplit --cwd=current
map alt+s        launch --location=hsplit --cwd=current
map alt+enter    launch --location=split --cwd=current
map alt+w        close_window

# --- 視窗導航 (HJKL) ---
map alt+h        neighboring_window left
map alt+l        neighboring_window right
map alt+k        neighboring_window up
map alt+j        neighboring_window down

# --- 佈局調整 ---
map alt+f        toggle_layout stack

# --- 分頁管理 ---
map alt+1        goto_tab 1
map alt+2        goto_tab 2
map alt+3        goto_tab 3
map alt+4        goto_tab 4
map alt+t        new_tab
map alt+q        close_tab

# --- 透明度動態調整 ---
map alt+shift+equal     change_background_opacity +0.05
map alt+shift+minus     change_background_opacity -0.05
map alt+shift+backspace change_background_opacity 1.0
